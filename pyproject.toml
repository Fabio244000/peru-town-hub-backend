[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "*/migrations/*",
    ".venv",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "B",
    "C4",
    "SIM",
    "UP",
    "PLR0915",
]

ignore = [
    "E501",
]

[tool.ruff.lint.pylint]
max-statements = 15

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
