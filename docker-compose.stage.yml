x-cloudwatch-logging: &cloudwatch-logging
  awslogs-region: ${AWS_REGION:?AWS_REGION is required}
  tag: '{{.Name}}'
  mode: non-blocking
  max-buffer-size: 4m

services:
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging
        awslogs-group: /peru-town-hub/stage/db

  web:
    image: ${ECR_IMAGE:?ECR_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - .env
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *cloudwatch-logging
        awslogs-group: /peru-town-hub/stage/web

volumes:
  postgres_data:
