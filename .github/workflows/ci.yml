name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      full-suite:
        description: Run the whole test suite with coverage instead of the affected tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit
        run: pip install "$(grep '^pre-commit==' requirements/local.txt)"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, so a pull request can be compared with its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create .env with random secrets
        run: scripts/ci/create_ci_env.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cached build of the image docker-compose.yml names for the web service.
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: compose/django/Dockerfile
          target: local
          tags: peru-town-hub-backend:local
          load: true
          push: false
          cache-from: type=gha,scope=local
          cache-to: type=gha,mode=max,scope=local

      - name: Check for missing migrations
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: Run the whole suite
        if: inputs.full-suite
        run: docker compose run --rm web pytest

      # When the affected tests cannot be computed, the whole suite runs.
      - name: Run the affected tests
        if: ${{ !inputs.full-suite }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          selected=$(git diff --name-only "$BASE_SHA" HEAD | python3 scripts/ci/select_tests.py) || selected=tests
          echo "Running: $selected"
          read -ra paths <<< "$selected"
          docker compose run --rm web pytest "${paths[@]}" --no-cov

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit dependencies
        run: pip-audit -r requirements/stage.txt

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env with random secrets
        run: scripts/ci/create_ci_env.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build stage image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: compose/django/Dockerfile
          target: stage
          tags: peru-town-hub-backend:stage
          load: true
          push: false
          cache-from: type=gha,scope=stage
          cache-to: type=gha,mode=max,scope=stage

      - name: Check stage deployment settings
        run: |
          docker run --rm --entrypoint python \
            --env-file .env \
            -e DJANGO_SETTINGS_MODULE=config.settings.stage \
            peru-town-hub-backend:stage \
            manage.py check --deploy --fail-level WARNING
